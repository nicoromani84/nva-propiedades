<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>¡Gracias! - NVA Propiedades</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800&family=Lato:wght@300;400;700&display=swap">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Lato', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #0A1929 0%, #0F2847 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 2rem;
        }

        .container {
            text-align: center;
            background: rgba(255, 255, 255, 0.95);
            padding: 4rem 2rem;
            border-radius: 8px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            max-width: 500px;
            width: 100%;
        }

        h1 {
            font-family: 'Playfair Display', Georgia, serif;
            color: #0A1929;
            margin-bottom: 1rem;
            font-size: 2.5rem;
        }

        .checkmark {
            font-size: 4rem;
            margin-bottom: 1rem;
        }

        p {
            color: #6B6B6B;
            font-size: 1.1rem;
            line-height: 1.8;
            margin-bottom: 2rem;
        }

        .button {
            display: inline-block;
            background: #0A1929;
            color: white;
            padding: 1rem 2rem;
            border-radius: 4px;
            text-decoration: none;
            font-weight: 600;
            transition: background 0.3s ease;
            border: none;
            cursor: pointer;
            font-size: 1rem;
        }

        .button:hover {
            background: #D4AF37;
            color: #0A1929;
        }

        .subtitle {
            color: #D4AF37;
            font-weight: 700;
            font-size: 0.95rem;
            margin-bottom: 1.5rem;
            letter-spacing: 0.5px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="checkmark">✓</div>
        <h1>¡Gracias!</h1>
        <p class="subtitle">Tu consulta fue enviada correctamente</p>
        <p>
            Hemos recibido tu mensaje y nos pondremos en contacto dentro de las próximas 24 horas.<br>
            <br>
            Nos alegra poder ayudarte con tu operación inmobiliaria.
        </p>
        <a href="/" class="button">Volver al Sitio</a>
    </div>

    <script>
        // Redirigir automáticamente después de 5 segundos
        setTimeout(() => {
            window.location.href = '/';
        }, 5000);
    </script>
</body>
</html>
