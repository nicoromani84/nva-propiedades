<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Admin - NVA Propiedades</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800&family=Lato:wght@300;400;700&display=swap">
    <style>
        :root {
            --primary-dark: #0A1929;
            --accent-gold: #D4AF37;
            --text-light: #FFFFFF;
            --bg-light: #F9F7F4;
            --text-muted: #6B6B6B;
            --border-color: #E8E6E1;
            --danger: #c0392b;
            --success: #27ae60;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Lato', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: var(--bg-light);
            color: #2C2C2C;
            min-height: 100vh;
        }

        header {
            background: var(--primary-dark);
            color: var(--text-light);
            padding: 1.5rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 1rem;
            flex-wrap: wrap;
        }

        header h1 { font-family: 'Playfair Display', serif; font-size: 1.6rem; }

        .container { max-width: 1200px; margin: 0 auto; padding: 2rem; }

        h2.section-title {
            font-family: 'Playfair Display', serif;
            font-size: 1.6rem;
            color: var(--primary-dark);
            margin: 1rem 0 1.5rem;
        }

        button {
            font-family: 'Lato', sans-serif;
            font-size: 0.95rem;
            font-weight: 600;
            border: none;
            border-radius: 4px;
            padding: 0.7rem 1.3rem;
            cursor: pointer;
            transition: all 0.25s ease;
        }
        button:disabled { opacity: 0.6; cursor: wait; }

        .btn-primary { background: var(--primary-dark); color: var(--text-light); }
        .btn-primary:hover { background: var(--accent-gold); color: var(--primary-dark); }
        .btn-gold { background: var(--accent-gold); color: var(--primary-dark); }
        .btn-gold:hover { opacity: 0.9; }
        .btn-ghost { background: transparent; color: var(--primary-dark); border: 1px solid var(--border-color); }
        .btn-ghost:hover { border-color: var(--accent-gold); }
        .btn-danger { background: var(--danger); color: var(--text-light); }
        .btn-success { background: var(--success); color: var(--text-light); }

        .toolbar { display: flex; gap: 1rem; align-items: center; margin-bottom: 1rem; flex-wrap: wrap; }

        .status {
            display: none;
            padding: 0.9rem 1rem;
            border-radius: 4px;
            margin-bottom: 1.5rem;
            font-size: 0.95rem;
        }
        .status.show { display: block; }
        .status.ok { background: #d4edda; color: #155724; }
        .status.error { background: #f8d7da; color: #721c24; }
        .status.info { background: #fff3cd; color: #664d03; }

        .properties-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 1.5rem;
        }

        .property-card {
            background: var(--text-light);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .property-image {
            height: 180px;
            background: linear-gradient(135deg, var(--primary-dark), var(--accent-gold));
        }
        .property-image img { width: 100%; height: 100%; object-fit: cover; display: block; }

        .property-info { padding: 1.2rem; display: flex; flex-direction: column; gap: 0.5rem; flex: 1; }
        .property-info h3 { font-family: 'Playfair Display', serif; color: var(--primary-dark); font-size: 1.15rem; }
        .property-type {
            align-self: flex-start;
            background: var(--accent-gold);
            color: var(--primary-dark);
            font-size: 0.75rem;
            font-weight: 700;
            padding: 0.2rem 0.6rem;
            border-radius: 2px;
            letter-spacing: 0.5px;
        }
        .property-desc { color: var(--text-muted); font-size: 0.9rem; line-height: 1.5; }
        .property-link { color: var(--accent-gold); font-size: 0.85rem; word-break: break-all; }

        .property-actions { display: flex; gap: 0.5rem; margin-top: auto; padding-top: 0.5rem; }
        .property-actions button { flex: 1; padding: 0.55rem; font-size: 0.85rem; }

        .empty { color: var(--text-muted); padding: 2rem 0; }

        /* Login */
        #loginScreen { display: flex; min-height: 100vh; align-items: center; justify-content: center; padding: 1rem; }
        .login-box {
            background: var(--text-light);
            padding: 2.5rem;
            border-radius: 8px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.08);
            width: 100%;
            max-width: 380px;
        }
        .login-box h1 { font-family: 'Playfair Display', serif; color: var(--primary-dark); text-align: center; margin-bottom: 1.5rem; }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.5);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }
        .modal.active { display: flex; }
        .modal-content {
            background: var(--text-light);
            border-radius: 8px;
            padding: 2rem;
            width: 100%;
            max-width: 600px;
            max-height: 90vh;
            overflow-y: auto;
        }
        .modal-content h2 { font-family: 'Playfair Display', serif; color: var(--primary-dark); margin-bottom: 1.5rem; }

        .form-group { margin-bottom: 1.2rem; }
        label { display: block; margin-bottom: 0.4rem; color: var(--primary-dark); font-weight: 700; font-size: 0.9rem; }
        input[type=text], input[type=password], input[type=url], select, textarea {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            font-family: 'Lato', sans-serif;
            font-size: 0.95rem;
            color: #2C2C2C;
            background: #fff;
        }
        input:focus, select:focus, textarea:focus { outline: none; border-color: var(--accent-gold); }
        textarea { resize: vertical; min-height: 110px; }

        .image-picker {
            border: 2px dashed var(--border-color);
            border-radius: 4px;
            padding: 1rem;
            text-align: center;
            cursor: pointer;
            color: var(--text-muted);
            font-size: 0.9rem;
        }
        .image-picker:hover { border-color: var(--accent-gold); }
        #imagePreview { width: 100%; max-height: 260px; object-fit: cover; border-radius: 4px; margin-top: 0.75rem; display: none; }
        #imagePreview.show { display: block; }

        .modal-actions { display: flex; gap: 1rem; margin-top: 1.5rem; }
        .modal-actions button { flex: 1; }

        @media (max-width: 600px) {
            .container { padding: 1rem; }
            .modal-content { padding: 1.5rem; }
        }
    </style>
</head>
<body>
    <div id="loginScreen">
        <div class="login-box">
            <h1>Administración</h1>
            <div class="form-group">
                <label for="password">Contraseña</label>
                <input type="password" id="password" autocomplete="current-password">
            </div>
            <div id="loginStatus" class="status error"></div>
            <button class="btn-primary" id="loginBtn" style="width: 100%;">Entrar</button>
        </div>
    </div>

    <div id="adminScreen" style="display: none;">
        <header>
            <h1>Propiedades</h1>
            <button class="btn-gold" id="logoutBtn">Cerrar sesión</button>
        </header>

        <div class="container">
            <div id="status" class="status"></div>

            <div class="toolbar">
                <button class="btn-success" id="addBtn">+ Agregar propiedad</button>
                <a href="/" target="_blank" style="color: var(--primary-dark); font-size: 0.9rem;">Ver sitio →</a>
            </div>

            <h2 class="section-title">Propiedades publicadas</h2>
            <div class="properties-grid" id="propertiesGrid"></div>
        </div>
    </div>

    <div class="modal" id="propertyModal">
        <div class="modal-content">
            <h2 id="modalTitle">Nueva propiedad</h2>

            <div class="form-group">
                <label for="propertyType">Operación</label>
                <select id="propertyType">
                    <option value="VENTA">Venta</option>
                    <option value="ALQUILER">Alquiler</option>
                </select>
            </div>

            <div class="form-group">
                <label for="propertyTitle">Título</label>
                <input type="text" id="propertyTitle" placeholder="Ej: Casa de 82 m² - Caín">
            </div>

            <div class="form-group">
                <label for="propertyDesc">Descripción</label>
                <textarea id="propertyDesc" placeholder="Resumen de la propiedad..."></textarea>
            </div>

            <div class="form-group">
                <label for="propertyLink">Link (publicación original)</label>
                <input type="url" id="propertyLink" placeholder="https://...">
            </div>

            <div class="form-group">
                <label>Foto principal</label>
                <label class="image-picker" for="imageFile">
                    Hacé clic para elegir una imagen (se optimiza automáticamente)
                </label>
                <input type="file" id="imageFile" accept="image/*" style="display: none;">
                <img id="imagePreview" alt="Vista previa">
            </div>

            <div id="modalStatus" class="status error"></div>

            <div class="modal-actions">
                <button class="btn-ghost" id="cancelBtn">Cancelar</button>
                <button class="btn-success" id="saveBtn">Guardar</button>
            </div>
        </div>
    </div>

    <script>
        const API = '/.netlify/functions';
        const SESSION_KEY = 'nva_admin_password';

        let properties = [];
        let editingId = null;
        let pendingImageUrl = '';

        const $ = (id) => document.getElementById(id);
        const escapeHtml = (value) => String(value ?? '').replace(/[&<>"']/g, (c) => ({
            '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
        }[c]));

        function showStatus(el, message, kind) {
            el.textContent = message;
            el.className = `status show ${kind}`;
        }
        function hideStatus(el) { el.className = 'status'; }

        function getPassword() { return sessionStorage.getItem(SESSION_KEY) || ''; }

        async function login() {
            const password = $('password').value;
            const btn = $('loginBtn');
            btn.disabled = true;
            try {
                const res = await fetch(`${API}/login`, { method: 'POST', headers: { 'x-admin-password': password } });
                if (!res.ok) {
                    showStatus($('loginStatus'), 'Contraseña incorrecta', 'error');
                    return;
                }
                sessionStorage.setItem(SESSION_KEY, password);
                $('password').value = '';
                hideStatus($('loginStatus'));
                showAdmin();
            } catch {
                showStatus($('loginStatus'), 'No se pudo conectar con el servidor', 'error');
            } finally {
                btn.disabled = false;
            }
        }

        function logout() {
            sessionStorage.removeItem(SESSION_KEY);
            $('adminScreen').style.display = 'none';
            $('loginScreen').style.display = 'flex';
        }

        async function showAdmin() {
            $('loginScreen').style.display = 'none';
            $('adminScreen').style.display = 'block';
            await loadProperties();
        }

        async function loadProperties() {
            try {
                const res = await fetch(`${API}/properties`, { cache: 'no-store' });
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                properties = await res.json();
                renderProperties();
            } catch (err) {
                showStatus($('status'), 'No se pudieron cargar las propiedades. Revisá la conexión y recargá la página.', 'error');
            }
        }

        function renderProperties() {
            const grid = $('propertiesGrid');
            if (!properties.length) {
                grid.innerHTML = '<p class="empty">No hay propiedades cargadas.</p>';
                return;
            }
            grid.innerHTML = properties.map((p) => `
                <div class="property-card">
                    <div class="property-image">
                        ${p.image ? `<img src="${escapeHtml(p.image)}" alt="${escapeHtml(p.title)}" onerror="this.style.display='none'">` : ''}
                    </div>
                    <div class="property-info">
                        <span class="property-type">${escapeHtml(p.type)}</span>
                        <h3>${escapeHtml(p.title)}</h3>
                        <p class="property-desc">${escapeHtml(p.desc)}</p>
                        <a class="property-link" href="${escapeHtml(p.link)}" target="_blank" rel="noopener">${escapeHtml(p.link)}</a>
                        <div class="property-actions">
                            <button class="btn-primary" data-edit="${escapeHtml(p.id)}">Editar</button>
                            <button class="btn-danger" data-delete="${escapeHtml(p.id)}">Eliminar</button>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function openModal(property) {
            editingId = property ? property.id : null;
            pendingImageUrl = property ? property.image : '';
            $('modalTitle').textContent = property ? 'Editar propiedad' : 'Nueva propiedad';
            $('propertyType').value = property ? property.type : 'VENTA';
            $('propertyTitle').value = property ? property.title : '';
            $('propertyDesc').value = property ? property.desc : '';
            $('propertyLink').value = property ? property.link : '';
            $('imageFile').value = '';
            const preview = $('imagePreview');
            preview.src = pendingImageUrl || '';
            preview.classList.toggle('show', Boolean(pendingImageUrl));
            hideStatus($('modalStatus'));
            $('propertyModal').classList.add('active');
        }

        function closeModal() {
            $('propertyModal').classList.remove('active');
        }

        function resizeImage(file, maxSize = 1600) {
            return new Promise((resolve, reject) => {
                const img = new Image();
                img.onload = () => {
                    const scale = Math.min(1, maxSize / Math.max(img.width, img.height));
                    const canvas = document.createElement('canvas');
                    canvas.width = Math.round(img.width * scale);
                    canvas.height = Math.round(img.height * scale);
                    canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
                    canvas.toBlob((blob) => (blob ? resolve(blob) : reject(new Error('No se pudo procesar la imagen'))), 'image/jpeg', 0.85);
                    URL.revokeObjectURL(img.src);
                };
                img.onerror = () => reject(new Error('El archivo no es una imagen válida'));
                img.src = URL.createObjectURL(file);
            });
        }

        async function onImageSelected() {
            const file = $('imageFile').files[0];
            if (!file) return;
            const modalStatus = $('modalStatus');
            showStatus(modalStatus, 'Subiendo imagen...', 'info');
            $('saveBtn').disabled = true;
            try {
                const blob = await resizeImage(file);
                const res = await fetch(`${API}/upload`, {
                    method: 'POST',
                    headers: { 'x-admin-password': getPassword(), 'content-type': 'image/jpeg' },
                    body: blob,
                });
                const data = await res.json().catch(() => ({}));
                if (!res.ok) throw new Error(data.error || `Error ${res.status}`);
                pendingImageUrl = data.url;
                $('imagePreview').src = data.url;
                $('imagePreview').classList.add('show');
                hideStatus(modalStatus);
            } catch (err) {
                showStatus(modalStatus, `No se pudo subir la imagen: ${err.message}`, 'error');
                $('imageFile').value = '';
            } finally {
                $('saveBtn').disabled = false;
            }
        }

        async function persist(nextList) {
            const res = await fetch(`${API}/properties`, {
                method: 'PUT',
                headers: { 'content-type': 'application/json', 'x-admin-password': getPassword() },
                body: JSON.stringify(nextList),
            });
            if (res.status === 401) {
                logout();
                throw new Error('La sesión expiró. Volvé a ingresar.');
            }
            if (!res.ok) throw new Error(`Error ${res.status} al guardar`);
            properties = nextList;
            renderProperties();
        }

        async function saveProperty() {
            const title = $('propertyTitle').value.trim();
            const desc = $('propertyDesc').value.trim();
            const link = $('propertyLink').value.trim();
            const type = $('propertyType').value;
            const modalStatus = $('modalStatus');

            if (!title || !desc || !link || !pendingImageUrl) {
                showStatus(modalStatus, 'Completá título, descripción, link y foto.', 'error');
                return;
            }

            const next = editingId === null
                ? [...properties, { id: Date.now(), type, title, desc, link, image: pendingImageUrl }]
                : properties.map((p) => (p.id === editingId ? { ...p, type, title, desc, link, image: pendingImageUrl } : p));

            $('saveBtn').disabled = true;
            try {
                await persist(next);
                closeModal();
                showStatus($('status'), 'Cambios guardados. Se ven en el sitio en unos segundos.', 'ok');
                setTimeout(() => hideStatus($('status')), 4000);
            } catch (err) {
                showStatus(modalStatus, err.message, 'error');
            } finally {
                $('saveBtn').disabled = false;
            }
        }

        async function deleteProperty(id) {
            const property = properties.find((p) => String(p.id) === String(id));
            if (!property || !confirm(`¿Eliminar "${property.title}"?`)) return;
            try {
                await persist(properties.filter((p) => String(p.id) !== String(id)));
                showStatus($('status'), 'Propiedad eliminada.', 'ok');
                setTimeout(() => hideStatus($('status')), 4000);
            } catch (err) {
                showStatus($('status'), err.message, 'error');
            }
        }

        $('loginBtn').addEventListener('click', login);
        $('password').addEventListener('keydown', (e) => { if (e.key === 'Enter') login(); });
        $('logoutBtn').addEventListener('click', logout);
        $('addBtn').addEventListener('click', () => openModal(null));
        $('cancelBtn').addEventListener('click', closeModal);
        $('saveBtn').addEventListener('click', saveProperty);
        $('imageFile').addEventListener('change', onImageSelected);
        $('propertyModal').addEventListener('click', (e) => { if (e.target.id === 'propertyModal') closeModal(); });

        $('propertiesGrid').addEventListener('click', (e) => {
            const editId = e.target.dataset.edit;
            const deleteId = e.target.dataset.delete;
            if (editId) openModal(properties.find((p) => String(p.id) === String(editId)));
            if (deleteId) deleteProperty(deleteId);
        });

        if (getPassword()) {
            fetch(`${API}/login`, { method: 'POST', headers: { 'x-admin-password': getPassword() } })
                .then((res) => { if (res.ok) showAdmin(); else logout(); });
        }
    </script>
</body>
</html>
