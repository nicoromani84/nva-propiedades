<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - NVA Propiedades</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800&family=Lato:wght@300;400;700&display=swap">
    <style>
        :root {
            --primary-dark: #0A1929;
            --accent-gold: #D4AF37;
            --text-light: #FFFFFF;
            --bg-light: #F9F7F4;
            --text-muted: #6B6B6B;
            --border-color: #E8E6E1;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Lato', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: var(--bg-light);
            color: var(--text-muted);
        }

        header {
            background: var(--primary-dark);
            color: var(--text-light);
            padding: 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h1 {
            font-family: 'Playfair Display', serif;
            font-size: 1.8rem;
        }

        .logout-btn {
            background: var(--accent-gold);
            color: var(--primary-dark);
            border: none;
            padding: 0.75rem 1.5rem;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .logout-btn:hover {
            opacity: 0.9;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
        }

        .section-title {
            font-family: 'Playfair Display', serif;
            font-size: 1.8rem;
            color: var(--primary-dark);
            margin-bottom: 2rem;
            margin-top: 2rem;
        }

        .btn-group {
            display: flex;
            gap: 1rem;
            margin-bottom: 2rem;
            flex-wrap: wrap;
        }

        .btn {
            background: var(--primary-dark);
            color: var(--text-light);
            border: none;
            padding: 0.75rem 1.5rem;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
            font-size: 0.95rem;
        }

        .btn:hover {
            background: var(--accent-gold);
            color: var(--primary-dark);
        }

        .btn-secondary {
            background: var(--text-muted);
        }

        .btn-danger {
            background: #e74c3c;
        }

        .btn-danger:hover {
            background: #c0392b;
        }

        .btn-success {
            background: #27ae60;
        }

        .btn-success:hover {
            background: #229954;
        }

        .properties-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 2rem;
            margin-bottom: 3rem;
        }

        .property-card {
            background: var(--text-light);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        }

        .property-image {
            width: 100%;
            height: 200px;
            background: linear-gradient(135deg, var(--primary-dark), var(--accent-gold));
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            color: white;
            font-size: 3rem;
        }

        .property-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .property-info {
            padding: 1.5rem;
        }

        .property-info h3 {
            color: var(--primary-dark);
            margin-bottom: 0.5rem;
            font-size: 1.2rem;
        }

        .property-desc {
            color: var(--text-muted);
            font-size: 0.9rem;
            margin-bottom: 1rem;
            line-height: 1.6;
        }

        .property-link {
            color: var(--accent-gold);
            font-size: 0.85rem;
            word-break: break-all;
            margin-bottom: 1rem;
            display: block;
        }

        .property-actions {
            display: flex;
            gap: 0.5rem;
        }

        .property-actions button {
            flex: 1;
            padding: 0.5rem;
            font-size: 0.85rem;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: var(--text-light);
            border-radius: 8px;
            padding: 2rem;
            max-width: 600px;
            width: 90%;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        .modal-title {
            font-family: 'Playfair Display', serif;
            font-size: 1.8rem;
            color: var(--primary-dark);
            margin-bottom: 1.5rem;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        label {
            display: block;
            margin-bottom: 0.5rem;
            color: var(--primary-dark);
            font-weight: 600;
            font-size: 0.95rem;
        }

        input, textarea, select {
            width: 100%;
            padding: 0.875rem;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            font-family: 'Lato', sans-serif;
            font-size: 0.95rem;
            color: var(--text-muted);
            transition: border-color 0.3s ease;
        }

        input:focus, textarea:focus, select:focus {
            outline: none;
            border-color: var(--accent-gold);
            background: rgba(212, 175, 55, 0.05);
        }

        textarea {
            resize: vertical;
            min-height: 120px;
        }

        .form-actions {
            display: flex;
            gap: 1rem;
            margin-top: 2rem;
        }

        .form-actions button {
            flex: 1;
        }

        .login-container {
            max-width: 400px;
            margin: 5rem auto;
            background: var(--text-light);
            padding: 3rem;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        }

        .login-container h1 {
            font-family: 'Playfair Display', serif;
            color: var(--primary-dark);
            margin-bottom: 2rem;
            text-align: center;
        }

        .image-preview {
            width: 100%;
            max-height: 300px;
            border-radius: 4px;
            margin-top: 1rem;
            display: none;
        }

        .image-preview.show {
            display: block;
        }

        .file-input-wrapper {
            position: relative;
            overflow: hidden;
            display: inline-block;
            width: 100%;
        }

        .file-input-wrapper input[type=file] {
            position: absolute;
            left: -9999px;
        }

        .file-input-label {
            display: block;
            padding: 0.875rem;
            background: var(--bg-light);
            border: 2px dashed var(--border-color);
            border-radius: 4px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            color: var(--text-muted);
        }

        .file-input-label:hover {
            border-color: var(--accent-gold);
            background: rgba(212, 175, 55, 0.05);
        }

        .success-message {
            background: #d4edda;
            color: #155724;
            padding: 1rem;
            border-radius: 4px;
            margin-bottom: 1rem;
            display: none;
        }

        .success-message.show {
            display: block;
        }

        .export-import {
            background: var(--bg-light);
            padding: 1.5rem;
            border-radius: 8px;
            margin-bottom: 2rem;
        }

        @media (max-width: 768px) {
            .properties-grid {
                grid-template-columns: 1fr;
            }

            header {
                flex-direction: column;
                gap: 1rem;
                text-align: center;
            }
        }
    </style>
</head>
<body>
    <div id="loginScreen">
        <div class="login-container">
            <h1>🔐 Administración</h1>
            <div class="form-group">
                <label for="password">Contraseña</label>
                <input type="password" id="password" placeholder="Ingresa tu contraseña">
            </div>
            <button class="btn" onclick="login()" style="width: 100%;">Entrar</button>
        </div>
    </div>

    <div id="adminScreen" style="display: none;">
        <header>
            <h1>🏢 Administración de Propiedades</h1>
            <button class="logout-btn" onclick="logout()">Cerrar Sesión</button>
        </header>

        <div class="container">
            <div class="success-message" id="successMessage">✓ Cambios guardados correctamente</div>

            <div class="export-import">
                <h3 style="color: var(--primary-dark); margin-bottom: 1rem;">📥 Importar/Exportar Datos</h3>
                <div class="btn-group">
                    <button class="btn btn-secondary" onclick="exportData()">📤 Descargar JSON</button>
                    <button class="btn btn-secondary" onclick="document.getElementById('importFile').click()">📥 Cargar JSON</button>
                    <input type="file" id="importFile" style="display: none;" accept=".json" onchange="importData(event)">
                </div>
            </div>

            <div class="btn-group">
                <button class="btn btn-success" onclick="openModal()">+ Agregar Propiedad</button>
            </div>

            <h2 class="section-title">Propiedades</h2>

            <div class="properties-grid" id="propertiesGrid"></div>
        </div>
    </div>

    <!-- Modal para editar/crear propiedad -->
    <div class="modal" id="propertyModal">
        <div class="modal-content">
            <h2 class="modal-title" id="modalTitle">Nueva Propiedad</h2>

            <div class="form-group">
                <label for="propertyType">Tipo</label>
                <select id="propertyType">
                    <option value="VENTA">Venta</option>
                    <option value="ALQUILER">Alquiler</option>
                </select>
            </div>

            <div class="form-group">
                <label for="propertyTitle">Título</label>
                <input type="text" id="propertyTitle" placeholder="Ej: Casa de 82 m² - Caín">
            </div>

            <div class="form-group">
                <label for="propertyDesc">Descripción</label>
                <textarea id="propertyDesc" placeholder="Descripción de la propiedad..."></textarea>
            </div>

            <div class="form-group">
                <label for="propertyLink">Link</label>
                <input type="url" id="propertyLink" placeholder="https://...">
            </div>

            <div class="form-group">
                <label>Foto</label>
                <div class="file-input-wrapper">
                    <input type="file" id="propertyImage" accept="image/*" onchange="previewImage()">
                    <label for="propertyImage" class="file-input-label">
                        📸 Haz clic o arrastra una imagen aquí
                    </label>
                </div>
                <img id="imagePreview" class="image-preview">
            </div>

            <div class="form-actions">
                <button class="btn btn-danger" onclick="closeModal()">Cancelar</button>
                <button class="btn btn-success" onclick="saveProperty()">Guardar</button>
            </div>
        </div>
    </div>

    <script>
        const ADMIN_PASSWORD = "admin123"; // Cambiar en producción
        let currentPropertyId = null;
        let properties = [];

        // Cargar propiedades al iniciar
        function loadProperties() {
            const stored = localStorage.getItem('nva_properties');
            properties = stored ? JSON.parse(stored) : getDefaultProperties();
            renderProperties();
        }

        function getDefaultProperties() {
            return [
                {
                    id: 1,
                    type: "VENTA",
                    title: "Casa de 82 m² - Caín",
                    desc: "3 habitaciones en zona residencial. Propiedad con buen potencial de inversión y ubicación tranquila.",
                    link: "https://www.zonaprop.com.ar/propiedades/clasificado/veclcain-casa-de-82-m-sup2--con-3-habitaciones-en-venta-en-59961299.html",
                    image: "https://imgar.zonapropcdn.com/avisos/resize/1/00/59/96/12/99/1200x1200/2073819550.jpg?isFirstImage=true"
                },
                {
                    id: 2,
                    type: "VENTA",
                    title: "Tres Ambientes al Frente - Las Heras",
                    desc: "Con balcón y baulera. Departamento luminoso en zona céntrica con acceso a comercios y transporte.",
                    link: "https://www.zonaprop.com.ar/propiedades/clasificado/veclapin-tres-ambientes-al-frente-con-balcon-y-baulera-a-m-de-59789661.html",
                    image: "https://imgar.zonapropcdn.com/avisos/resize/1/00/59/78/96/61/1200x1200/2069732154.jpg?isFirstImage=true"
                },
                {
                    id: 3,
                    type: "VENTA",
                    title: "3 Ambientes con Cochera - Uruguay",
                    desc: "Con cochera propia. Departamento moderno, ideal para familia o inversión en zona céntrica.",
                    link: "https://www.zonaprop.com.ar/propiedades/clasificado/veclapin-3-ambientes-con-cochera-en-pilar-centro-consultar-59819195.html",
                    image: "https://imgar.zonapropcdn.com/avisos/resize/1/00/59/81/91/95/1200x1200/2070469705.jpg?isFirstImage=true"
                }
            ];
        }

        function renderProperties() {
            const grid = document.getElementById('propertiesGrid');
            grid.innerHTML = properties.map(prop => `
                <div class="property-card">
                    <div class="property-image">
                        <img src="${prop.image}" alt="${prop.title}" onerror="this.style.display='none'">
                    </div>
                    <div class="property-info">
                        <span style="color: var(--accent-gold); font-size: 0.8rem; font-weight: 600;">📌 ${prop.type}</span>
                        <h3>${prop.title}</h3>
                        <p class="property-desc">${prop.desc}</p>
                        <a href="${prop.link}" target="_blank" class="property-link">Ver más →</a>
                        <div class="property-actions">
                            <button class="btn" onclick="editProperty(${prop.id})">✏️ Editar</button>
                            <button class="btn btn-danger" onclick="deleteProperty(${prop.id})">🗑️ Eliminar</button>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function login() {
            const password = document.getElementById('password').value;
            if (password === ADMIN_PASSWORD) {
                document.getElementById('loginScreen').style.display = 'none';
                document.getElementById('adminScreen').style.display = 'block';
                loadProperties();
            } else {
                alert('Contraseña incorrecta');
                document.getElementById('password').value = '';
            }
        }

        function logout() {
            document.getElementById('loginScreen').style.display = 'block';
            document.getElementById('adminScreen').style.display = 'none';
            document.getElementById('password').value = '';
        }

        function openModal() {
            currentPropertyId = null;
            document.getElementById('modalTitle').textContent = 'Nueva Propiedad';
            document.getElementById('propertyType').value = 'VENTA';
            document.getElementById('propertyTitle').value = '';
            document.getElementById('propertyDesc').value = '';
            document.getElementById('propertyLink').value = '';
            document.getElementById('propertyImage').value = '';
            document.getElementById('imagePreview').classList.remove('show');
            document.getElementById('propertyModal').classList.add('active');
        }

        function closeModal() {
            document.getElementById('propertyModal').classList.remove('active');
        }

        function editProperty(id) {
            const prop = properties.find(p => p.id === id);
            if (prop) {
                currentPropertyId = id;
                document.getElementById('modalTitle').textContent = 'Editar Propiedad';
                document.getElementById('propertyType').value = prop.type;
                document.getElementById('propertyTitle').value = prop.title;
                document.getElementById('propertyDesc').value = prop.desc;
                document.getElementById('propertyLink').value = prop.link;
                const preview = document.getElementById('imagePreview');
                preview.src = prop.image;
                preview.classList.add('show');
                document.getElementById('propertyModal').classList.add('active');
            }
        }

        function deleteProperty(id) {
            if (confirm('¿Estás seguro de que quieres eliminar esta propiedad?')) {
                properties = properties.filter(p => p.id !== id);
                saveProperties();
            }
        }

        function previewImage() {
            const input = document.getElementById('propertyImage');
            const preview = document.getElementById('imagePreview');
            const reader = new FileReader();

            reader.onload = (e) => {
                preview.src = e.target.result;
                preview.classList.add('show');
            };

            if (input.files[0]) {
                reader.readAsDataURL(input.files[0]);
            }
        }

        function saveProperty() {
            const title = document.getElementById('propertyTitle').value.trim();
            const desc = document.getElementById('propertyDesc').value.trim();
            const link = document.getElementById('propertyLink').value.trim();
            const type = document.getElementById('propertyType').value;
            const image = document.getElementById('imagePreview').src;

            if (!title || !desc || !link || !image) {
                alert('Por favor completa todos los campos');
                return;
            }

            if (currentPropertyId) {
                const prop = properties.find(p => p.id === currentPropertyId);
                if (prop) {
                    prop.type = type;
                    prop.title = title;
                    prop.desc = desc;
                    prop.link = link;
                    prop.image = image;
                }
            } else {
                const newId = Math.max(...properties.map(p => p.id), 0) + 1;
                properties.push({
                    id: newId,
                    type,
                    title,
                    desc,
                    link,
                    image
                });
            }

            saveProperties();
            closeModal();
            showSuccess();
        }

        function saveProperties() {
            localStorage.setItem('nva_properties', JSON.stringify(properties));
            renderProperties();
        }

        function showSuccess() {
            const msg = document.getElementById('successMessage');
            msg.classList.add('show');
            setTimeout(() => msg.classList.remove('show'), 2000);
        }

        function exportData() {
            const dataStr = JSON.stringify(properties, null, 2);
            const dataBlob = new Blob([dataStr], { type: 'application/json' });
            const url = URL.createObjectURL(dataBlob);
            const link = document.createElement('a');
            link.href = url;
            link.download = 'propiedades.json';
            link.click();
        }

        function importData(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = (e) => {
                try {
                    const imported = JSON.parse(e.target.result);
                    if (Array.isArray(imported)) {
                        properties = imported;
                        saveProperties();
                        showSuccess();
                    } else {
                        alert('Formato JSON inválido');
                    }
                } catch (err) {
                    alert('Error al leer el archivo: ' + err.message);
                }
            };
            reader.readAsText(file);
        }

        // Modal click outside
        document.getElementById('propertyModal').addEventListener('click', (e) => {
            if (e.target.id === 'propertyModal') closeModal();
        });

        // Enter para login
        document.getElementById('password')?.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') login();
        });
    </script>
</body>
</html>
